<title>Mapa EB — Prospectos</title>
<link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'>
<style>
:root{--eb:#2E7DF6;--eb2:#6D5DF6;--rojo:#E5322D;--azul:#2E7DF6;--verde:#22B07D;--ink:#0B1B3B;--mut:#7A879C;--linea:#e8edf3}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#map{height:100%;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eaf0f6;color:var(--ink)}
#map,#lista{position:absolute;inset:0}
#lista{top:0;z-index:1100;background:#f3f6fa;overflow-y:auto;padding:150px 14px 40px;display:none}
/* ---- controles superiores ---- */
#top{position:absolute;z-index:1200;top:14px;left:14px;right:14px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
.row{display:flex;gap:10px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border-radius:15px;padding:12px 15px;
box-shadow:0 8px 26px rgba(11,27,59,.12);border:1px solid rgba(255,255,255,.7)}
.search input{border:0;outline:0;font-size:15px;width:100%;color:var(--ink);background:transparent}
.search svg{width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:2}
.btn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #e3e9f1;border-radius:15px;
padding:12px 15px;font-size:15px;font-weight:700;color:var(--eb);box-shadow:0 8px 26px rgba(11,27,59,.1);cursor:pointer}
.btn svg{width:17px;height:17px;fill:none;stroke:var(--eb);stroke-width:2}
.seg{display:inline-flex;background:#fff;border-radius:14px;padding:5px;box-shadow:0 8px 26px rgba(11,27,59,.1);border:1px solid #eef2f7}
.seg button{border:0;background:transparent;font-size:14px;font-weight:700;color:var(--mut);padding:8px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:linear-gradient(135deg,#eef4ff,#eae9ff);color:var(--eb)}
.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.loc{margin-left:auto;width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid #e6ecf4;
display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(11,27,59,.12);cursor:pointer}
.loc svg{width:20px;height:20px;fill:none;stroke:var(--eb);stroke-width:2}
#panel{display:none;background:#fff;border-radius:16px;padding:11px;gap:8px;flex-wrap:wrap;
box-shadow:0 10px 30px rgba(11,27,59,.14)}
#panel.show{display:flex}
#panel select{flex:1;min-width:130px;font-size:14px;padding:10px 12px;border:1px solid #e3e9f1;border-radius:11px;background:#fff;color:var(--ink);outline:none}
.lockchip{display:none;align-items:center;gap:7px;font-size:13px;font-weight:800;padding:9px 13px;border-radius:12px;
background:linear-gradient(135deg,#eef4ff,#eee9ff);border:1px solid #d9deff;color:#3730a3;width:100%}
/* ---- pines ---- */
.pin{position:relative;width:34px;height:40px}
.pin .head{position:absolute;top:0;left:50%;transform:translateX(-50%);width:32px;height:32px;border-radius:11px;
background:#fff;display:flex;align-items:center;justify-content:center;border:2px solid var(--azul);
box-shadow:0 4px 8px rgba(46,125,246,.35)}
.pin .head:after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%) rotate(45deg);
width:11px;height:11px;background:#fff;border-right:2px solid var(--azul);border-bottom:2px solid var(--azul);border-radius:0 0 3px 0}
.pin .head svg{width:17px;height:17px;fill:var(--azul)}
.pin .ripple{position:absolute;bottom:-7px;left:50%;width:34px;height:13px;transform:translateX(-50%);border-radius:50%;
background:radial-gradient(closest-side,rgba(46,125,246,.5),transparent)}
.pin.v .head{border-color:var(--rojo);box-shadow:0 4px 8px rgba(229,50,45,.35)}
.pin.v .head:after{border-color:var(--rojo)}
.pin.v .head svg{fill:var(--rojo)}
.pin.v .ripple{background:radial-gradient(closest-side,rgba(229,50,45,.5),transparent)}
.pin.sel .head{transform:translateX(-50%) scale(1.18)}
.pin.sel .ripple{animation:sonar 1.5s ease-out infinite}
@keyframes sonar{0%{box-shadow:0 0 0 0 rgba(46,125,246,.45)}100%{box-shadow:0 0 0 26px rgba(46,125,246,0)}}
.pin.v.sel .ripple{animation:sonarR 1.5s ease-out infinite}
@keyframes sonarR{0%{box-shadow:0 0 0 0 rgba(229,50,45,.45)}100%{box-shadow:0 0 0 26px rgba(229,50,45,0)}}
.yo{width:18px;height:18px;border-radius:50%;background:#2E7DF6;border:3px solid #fff;box-shadow:0 0 0 4px rgba(46,125,246,.3)}
/* ---- tarjeta ---- */
#card{position:absolute;z-index:1200;left:14px;right:14px;bottom:112px;background:#fff;border-radius:20px;
box-shadow:0 16px 44px rgba(11,27,59,.22);padding:15px;display:none;animation:up .25s ease}
.cclose{position:absolute;top:11px;right:11px;width:30px;height:30px;border-radius:50%;border:0;
background:#f1f4f9;color:#7A879C;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.cclose:active{background:#e6ebf2}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.ctop{display:flex;gap:13px;align-items:flex-start}
.thumb{width:62px;height:62px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#eaf1ff,#eee9ff)}
.thumb svg{width:28px;height:28px;fill:var(--eb)}
.cinfo{flex:1;min-width:0}
.cname{font-size:17px;font-weight:800;line-height:1.2}
.cmeta{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;margin-top:5px}
.cmeta svg{width:14px;height:14px;fill:none;stroke:var(--mut);stroke-width:2}
.cstat{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700;margin-top:7px}
.sdot{width:11px;height:11px;border-radius:50%}.sdot.a{background:var(--azul)}.sdot.r{background:var(--rojo)}
.tipo{display:none;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:6px 11px;border-radius:999px;margin-top:10px}
.tipo svg{width:15px;height:15px;fill:currentColor}
.tipo.pj{background:#ecfdf5;color:#047857;border:1px solid #b7ebd6}
.tipo.pp{background:#eef2ff;color:#4338ca;border:1px solid #cfd6ff}
.tsel{display:flex;gap:8px;margin-top:10px}
.tbtn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:8px 11px;border-radius:999px;
cursor:pointer;border:1.5px solid #e3e9f1;background:#fff;color:#98a2b3;transition:all .12s}
.tbtn svg{width:15px;height:15px;fill:currentColor}
.tbtn:active{transform:scale(.96)}
.tbtn.on.pj{background:#ecfdf5;color:#047857;border-color:#6ee7b7}
.tbtn.on.pp{background:#eef2ff;color:#4338ca;border-color:#a5b4fc}
.cstar{font-size:20px;color:#cdd6e2;cursor:pointer}
.cact{display:flex;gap:10px;margin-top:14px}
.nav{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#2E7DF6,#5B6BF6);
color:#fff;font-weight:800;font-size:15px;padding:13px;border-radius:14px;text-decoration:none;box-shadow:0 8px 20px rgba(46,125,246,.35)}
.nav svg{width:18px;height:18px;fill:#fff}
.icbtn{width:52px;border:1px solid #e3e9f1;border-radius:14px;background:#fff;font-size:18px;color:var(--eb);cursor:pointer}
/* ---- stats ---- */
#stats{position:absolute;z-index:1150;left:14px;right:14px;bottom:24px;background:#fff;border-radius:18px;
display:flex;box-shadow:0 12px 34px rgba(11,27,59,.14);overflow:hidden}
.stat{flex:1;display:flex;align-items:center;gap:11px;padding:15px 17px}
.stat+.stat{border-left:1px solid var(--linea)}
.stat .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.stat .ic.azul{background:#eaf1ff}.stat .ic.verde{background:#e7f7f0}
.stat .ic svg{width:20px;height:20px}
.stat small{color:var(--mut);font-size:12px;font-weight:600;display:block}
.stat b{font-size:20px;font-weight:800;color:var(--ink)}
/* lista */
.litem{display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:13px 14px;margin-bottom:10px;
box-shadow:0 4px 16px rgba(11,27,59,.07);cursor:pointer}
.litem .lic{width:40px;height:40px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;background:#eaf1ff}
.litem .lic.v{background:#fdeceb}.litem .lic svg{width:18px;height:18px;fill:var(--azul)}.litem .lic.v svg{fill:var(--rojo)}
.litem .lb{flex:1;min-width:0}.litem .lb b{font-size:14.5px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.litem .lb small{color:var(--mut);font-size:12.5px}
.litem .lgo{color:var(--eb);font-weight:800;font-size:13px;white-space:nowrap}
#cargando{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;
z-index:2000;background:#eaf0f6;color:var(--eb);font-size:15px;font-weight:700}
.spin{width:34px;height:34px;border:3px solid #cfe0f5;border-top-color:var(--eb);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.leaflet-control-zoom{display:none}
</style></head><body>
