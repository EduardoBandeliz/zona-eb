  let h='<b>'+p.n+'</b><br>'+(p.c||'')+' · <small>'+p.e+'</small>';
  if(inf)h+='<br><span class="pv">✓ Visitado</span> por '+quien+'<br><small>'+inf.f+' · a '+inf.d+' m'+(inf.c?' · '+inf.c:'')+'</small>';
  const q=p.lat+','+p.lng;
  h+='<br><a class="gm" href="https://www.google.com/maps/search/?api=1&query='+q+'" target="_blank" rel="noopener">📍 Abrir en Google Maps</a>'
    +'<br><span class="gm" style="cursor:pointer" onclick="return cop(this,\''+q+'\')">⧉ Copiar ubicación</span>'
    +'<br><small style="color:#94a3b8">'+q+'</small>';
  m.bindPopup(h); capa.addLayer(m);
 }
 cVis.textContent=vis; cPen.textContent=pen;
}
function cop(el,t){try{navigator.clipboard.writeText(t);}catch(e){}el.textContent='✓ Copiado';setTimeout(function(){el.textContent='⧉ Copiar ubicación';},1500);return false;}
fEstado.onchange=dibujar; fVend.onchange=dibujar; fCiudad.oninput=dibujar;
dibujar(); cargando.style.display='none';
</script></body></html>
