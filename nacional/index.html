<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>EB Mobile · Mapa Nacional de Prospectos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root { --azul:#159BD7; --marino:#0A1F44; --verde:#8DC63F; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
  #map { position:absolute; inset:0; z-index:1; }
  .panel {
    position:absolute; z-index:1000; top:10px; left:10px; right:10px;
    background:rgba(255,255,255,0.96); border-radius:14px; padding:10px 12px;
    box-shadow:0 6px 24px rgba(10,31,68,0.18); max-width:460px;
  }
  .marca { font-weight:900; font-size:16px; color:var(--marino); letter-spacing:-0.3px; }
  .marca b{ color:var(--azul); } .marca i{ color:var(--verde); font-style:normal; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  select, input {
    flex:1; min-width:120px; padding:9px 10px; border:1px solid #D9E2EC; border-radius:10px;
    font-size:14px; color:var(--marino); background:#fff;
  }
  .toggle { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--marino); font-weight:700; white-space:nowrap; }
  .conteo { margin-top:8px; font-size:12.5px; color:#51607A; font-weight:600; }
  .conteo b { color:var(--azul); }
  .leyenda { position:absolute; z-index:1000; bottom:16px; left:10px; background:rgba(255,255,255,0.95);
    border-radius:10px; padding:8px 10px; font-size:12px; color:var(--marino); box-shadow:0 4px 16px rgba(10,31,68,0.15); }
  .dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .pop b { color:var(--marino); font-size:14px; }
  .pop .t { color:#51607A; font-size:12px; margin:2px 0; }
  .pop a { display:inline-block; margin-top:6px; margin-right:10px; color:var(--azul); font-weight:700; text-decoration:none; font-size:13px; }
  .pop .wa { color:#1DAA52; }
  .pj { display:inline-block; background:#EAF7D8; color:#4e7d14; font-weight:800; font-size:11px; padding:2px 7px; border-radius:999px; margin-top:4px; }
  .cargando { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:1500;
    background:#0A1F44; color:#fff; font-size:16px; font-weight:700; flex-direction:column; gap:10px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <div class="marca"><b>EB</b><i> Mobile</i> · Mapa Nacional de Prospectos</div>
  <div class="row">
    <select id="estado"><option value="">Todos los estados</option></select>
    <label class="toggle"><input type="checkbox" id="soloPayjoy" /> Solo PayJoy</label>
  </div>
  <div class="row">
    <input id="busca" placeholder="Buscar negocio o ciudad…" />
  </div>
  <div class="conteo" id="conteo">Cargando…</div>
</div>
<div class="leyenda">
  <div><span class="dot" style="background:#8DC63F"></span>PayJoy / crédito</div>
  <div><span class="dot" style="background:#159BD7"></span>Otros</div>
</div>
<div class="cargando" id="cargando"><div>Cargando mapa nacional…</div><div style="font-size:13px;opacity:.8">34,070 prospectos</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const map = L.map('map', { preferCanvas:true, zoomControl:true }).setView([23.6, -102.5], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap'
}).addTo(map);
const canvas = L.canvas({ padding:0.5 });
const capa = L.layerGroup().addTo(map);

let DATA = [];
const selEstado = document.getElementById('estado');
const inpBusca = document.getElementById('busca');
const chkPayjoy = document.getElementById('soloPayjoy');
const elConteo = document.getElementById('conteo');

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const waLink = tel => { const d=(tel||'').replace(/\D/g,''); if(!d) return ''; const n=d.length===10?('52'+d):d; return 'https://wa.me/'+n; };

function filtrados() {
  const e = selEstado.value;
  const q = inpBusca.value.trim().toLowerCase();
  const pj = chkPayjoy.checked;
  const b = map.getBounds();
  const res = [];
  for (let i=0;i<DATA.length;i++) {
    const p = DATA[i];
    if (e && p.e !== e) continue;
    if (pj && !p.cr) continue;
    if (q && !((p.n||'').toLowerCase().includes(q) || (p.c||'').toLowerCase().includes(q))) continue;
    if (!b.contains([p.la, p.ln])) continue;
    res.push(p);
    if (res.length > 6000) break; // tope para fluidez
  }
  return res;
}

function totalFiltrado() {
  const e = selEstado.value, q = inpBusca.value.trim().toLowerCase(), pj = chkPayjoy.checked;
  let n=0;
  for (const p of DATA) {
    if (e && p.e !== e) continue;
    if (pj && !p.cr) continue;
    if (q && !((p.n||'').toLowerCase().includes(q) || (p.c||'').toLowerCase().includes(q))) continue;
    n++;
  }
  return n;
}

let pintarPendiente=false;
function pintar() {
  capa.clearLayers();
  const vis = filtrados();
  for (const p of vis) {
    const m = L.circleMarker([p.la, p.ln], {
      renderer: canvas, radius: 5, weight:1, color:'#fff', opacity:0.9,
      fillColor: p.cr ? '#8DC63F' : '#159BD7', fillOpacity:0.9
    });
    m.on('click', () => abrirPopup(p, m));
    capa.addLayer(m);
  }
  const total = totalFiltrado();
  elConteo.innerHTML = `<b>${total.toLocaleString('es-MX')}</b> prospectos` +
    (vis.length < total ? ` · mostrando ${vis.length.toLocaleString('es-MX')} (acerca para ver más)` : '');
}

function abrirPopup(p, m) {
  const wa = waLink(p.tel);
  const html = `<div class="pop"><b>${esc(p.n)}</b>` +
    `<div class="t">${esc(p.t||'')}</div>` +
    `<div class="t">📍 ${esc(p.c)}, ${esc(p.e)}</div>` +
    (p.r ? `<div class="t">⭐ ${p.r}</div>` : '') +
    (p.cr ? `<div class="pj">PayJoy / crédito</div>` : '') +
    `<div>` +
    (p.tel ? `<a href="tel:${esc(p.tel)}">📞 ${esc(p.tel)}</a>` : '') +
    (wa ? `<a class="wa" href="${wa}" target="_blank">WhatsApp</a>` : '') +
    `<a href="https://www.google.com/maps?q=${p.la},${p.ln}" target="_blank">Maps</a>` +
    `</div></div>`;
  m.bindPopup(html).openPopup();
}

function programarPintado() {
  if (pintarPendiente) return;
  pintarPendiente = true;
  requestAnimationFrame(() => { pintarPendiente=false; pintar(); });
}

map.on('moveend zoomend', programarPintado);
selEstado.onchange = () => {
  const e = selEstado.value;
  if (e) { // centra en el estado elegido
    const pts = DATA.filter(p=>p.e===e).map(p=>[p.la,p.ln]);
    if (pts.length) map.fitBounds(pts, { padding:[40,40], maxZoom:11 });
  }
  pintar();
};
inpBusca.oninput = () => programarPintado();
chkPayjoy.onchange = () => pintar();

fetch('chunks/manifest.json').then(r=>r.json()).then(async man => {
  const partes = await Promise.all(man.archivos.map(fn => fetch('chunks/'+fn).then(r=>r.json())));
  DATA = partes.flat();
  const estados = [...new Set(DATA.map(p=>p.e))].sort((a,b)=>a.localeCompare(b,'es'));
  for (const e of estados) {
    const o = document.createElement('option'); o.value=e; o.textContent=e; selEstado.appendChild(o);
  }
  document.getElementById('cargando').style.display='none';
  map.invalidateSize();
  setTimeout(() => { map.invalidateSize(); pintar(); }, 250);
  pintar();
}).catch(e => {
  document.getElementById('cargando').innerHTML = 'No pude cargar los datos.<br>'+e;
});
</script>
</body>
</html>
